# Static SPA on Netlify. Point the API at your workstation tunnel:
#   netlify env:set VITE_API_BASE "https://<your-api>.trycloudflare.com/api"
# then rebuild. CORS on the Spring backend already allows https://*.netlify.app.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
